# docker-compose.yml — Full stack local development
# Usage: docker-compose up --build
# ──────────────────────────────────────────────────────────────

version: '3.9'

services:

  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: arenablast-postgres
    environment:
      POSTGRES_DB: arenablast
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yourpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arenablast"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [arenablast-net]

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: arenablast-redis
    command: redis-server --save "" --appendonly no  # No persistence for dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [arenablast-net]

  # ── Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arenablast-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: arenablast
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-yourpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode===200?0:1))\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks: [arenablast-net]
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""  # Use Nginx proxy
    container_name: arenablast-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [arenablast-net]
    restart: unless-stopped

# ── Volumes ────────────────────────────────────────────────
volumes:
  postgres_data:
    name: arenablast-postgres-data

# ── Networks ───────────────────────────────────────────────
networks:
  arenablast-net:
    name: arenablast-network
