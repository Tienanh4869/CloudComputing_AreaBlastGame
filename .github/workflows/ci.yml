name: ArenaBlast CI/CD

on:
  push:
    branches: [main, develop, phuoc]
  pull_request:
    branches: [main]

env:
  ACR_NAME: arenablastacr          # Azure Container Registry name
  RESOURCE_GROUP: arenablast-rg    # Azure Resource Group
  BACKEND_APP: arenablast-backend
  FRONTEND_APP: arenablast-frontend

jobs:
  # ── Job 1: Lint & Test ─────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Run backend tests
        working-directory: ./backend
        run: npm test

      - name: Run Trivy vulnerability scanner (Cloud-Native Security)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ── Job 2: Build Docker Images ─────────────────────────────
  build:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Set image tags
        id: tags
        run: |
          echo "sha=${GITHUB_SHA}" >> $GITHUB_OUTPUT
          echo "backend=${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_APP }}" >> $GITHUB_OUTPUT
          echo "frontend=${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_APP }}" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.tags.outputs.backend }}:latest
            ${{ steps.tags.outputs.backend }}:${{ steps.tags.outputs.sha }}

      - name: Create Frontend Env File
        run: |
          echo "VITE_API_URL=https://arenablast-backend.icyhill-22f427c6.southeastasia.azurecontainerapps.io/api" > frontend/.env.production
          echo "VITE_SOCKET_URL=https://arenablast-backend.icyhill-22f427c6.southeastasia.azurecontainerapps.io" >> frontend/.env.production

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.tags.outputs.frontend }}:latest
            ${{ steps.tags.outputs.frontend }}:${{ steps.tags.outputs.sha }}

  # ── Job 3: Deploy to Azure Container Apps ─────────────────
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_APP }}:${{ github.sha }}

      - name: Deploy frontend to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_APP }}:${{ github.sha }}

      - name: Health check
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://arenablast-backend.icyhill-22f427c6.southeastasia.azurecontainerapps.io/health)
          if [ "$STATUS" != "200" ]; then echo "Health check failed: $STATUS" && exit 1; fi
          echo "✅ Deployment successful!"
